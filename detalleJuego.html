<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Juego</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header>
        <a href="index.html">
            <img
            src="img/logos/sonicinicio.png"
            alt="Sonic"
            width="80"
            >
        </a>
    </header>

    <main>
    <a href="juegos.html">← Volver a juegos</a>
    <div class="ficha-detalle">

        <div class="ficha-imagen">

            <img id="imagen">

        </div>

        <div class="ficha-info">

            <h1 id="nombre"></h1>

            <p>
                <strong>Año:</strong>
                <span id="anio"></span>
            </p>

            <p>
                <strong>Tipo:</strong>
                <span id="tipo"></span>
            </p>

            <p>
                <strong>Era:</strong>
                <span id="era"></span>
            </p>

            <p>
                <strong>Plataforma:</strong>
                <span id="plataforma"></span>
            </p>

        </div>

    </div>

    <hr>

    <h2>Descripción</h2>

    <p id="descripcion"></p>


    <hr>

    <h2>Personajes relacionados</h2>
    <ul id="listaPersonajes"></ul>

    <hr>

    <h2>Zonas relacionadas</h2>
    <ul id="listaZonas"></ul>

    <script src="js/modulos/xmlReader.js"></script>
    <script src="js/modulos/juegoManager.js"></script>
    <script src="js/detalleJuego.js"></script>
    </main>
</body>
</html>
