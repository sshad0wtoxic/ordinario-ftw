<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comparador</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <a href="index.html">
            <img
                src="img/logos/sonicinicio.png"
                alt="Sonic"
                width="80"
            >
        </a>
    </header>

    <main>

        <h1>Comparador de Personajes</h1>

        <div class="comparador-selectores">

            <div>

                <label for="personaje1">
                    Personaje 1
                </label>

                <select id="personaje1"></select>

            </div>

            <div>

                <label for="personaje2">
                    Personaje 2
                </label>

                <select id="personaje2"></select>

            </div>

        </div>

        <button onclick="comparar()">
            Comparar
        </button>

        <hr>

        <div id="resultado"></div>

    </main>

    <script src="js/modulos/xmlReader.js"></script>
    <script src="js/modulos/personajeManager.js"></script>
    <script src="js/comparador.js"></script>

</body>
</html>
