<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Personaje</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <a href="index.html">
            <img
            src="img/logos/sonicinicio.png"
            alt="Sonic"
            width="80"
            >
        </a>
    </header>

    <main>
    <a href="personajes.html">← Volver a personajes</a>
    <br>
        <div class="ficha-detalle">

        <div class="ficha-imagen">

            <img id="imagen">

        </div>

        <div class="ficha-info">

            <h1 id="nombre"></h1>

            <p>
                <strong>Alineación:</strong>
                <span id="alineacion"></span>
            </p>

            <p>
                <strong>Especie:</strong>
                <span id="especie"></span>
            </p>

            <p>
                <strong>Género:</strong>
                <span id="genero"></span>
            </p>

            <p>
                <strong>Juego debut:</strong>
                <span id="juegoDebut"></span>
            </p>

        </div>

    </div>

    <h2>Descripción</h2>
    <p id="descripcion"></p>

    <div class="estadisticas">
        <!--Estadísticas del personaje-->
        <h2>Estadísticas</h2>

        <p>
            Velocidad: <span id="valorVelocidad"></span>
        </p>
        <progress id="velocidad" max="100"></progress>

        <p>
            Fuerza: <span id="valorFuerza"></span>
        </p>
        <progress id="fuerza" max="100"></progress>

        <p>
            Inteligencia: <span id="valorInteligencia"></span>
        </p>
        <progress id="inteligencia" max="100"></progress>

    </div>

        <!--Habilidades del personaje-->
        <hr>

        <h2>Habilidades</h2>

        <ul id="listaHabilidades"></ul>

        <!--Juegos en los que aparece-->
        <hr>

        <h2>Juegos destacados</h2>

        <ul id="listaJuegos"></ul>

        <!--Zonas relacionadas al personaje-->
        <hr>
        
        <h2>Zonas relacionadas</h2>

        <ul id="listaZonas"></ul>



    </div>

    <script src="js/modulos/xmlReader.js"></script>
    <script src="js/modulos/personajeManager.js"></script>
    <script src="js/modulos/habilidadManager.js"></script>
    <script src="js/modulos/juegoManager.js"></script>
    <script src="js/modulos/zonasManager.js"></script>
    <script src="js/detallePersonaje.js"></script>
</main>
</body>
</html>
