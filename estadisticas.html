<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estadísticas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <a href="index.html">
            <img
            src="img/logos/sonicinicio.png"
            alt="Sonic"
            width="80"
            >
        </a>
    </header>
    
    <main>
    <h1>Estadísticas de Sonic Wiki</h1>
    <hr>
    <h2>Resumen General</h2>

    <div class="estadisticas-grid">

        <div class="card">
            <p id="totalPersonajes"></p>
        </div>

        <div class="card">
            <p id="totalJuegos"></p>
        </div>

        <div class="card">
            <p id="totalZonas"></p>
        </div>

        <div class="card">
            <p id="totalHabilidades"></p>
        </div>

    </div>
    <hr>

    <h2>Personajes por alineación</h2>

    <div class="estadisticas-grid">

        <div class="card">
            <p id="heroes"></p>
        </div>

        <div class="card">
            <p id="antiheroes"></p>
        </div>

        <div class="card">
            <p id="villanos"></p>
        </div>

    </div>

    <hr>

    <div class="estadisticas-grid">

        <div class="card">

            <h2>🏃 Top Velocidad</h2>

            <ol id="topVelocidad"></ol>

        </div>

        <div class="card">

            <h2>💪 Top Fuerza</h2>

            <ol id="topFuerza"></ol>

        </div>

        <div class="card">

            <h2>🧠 Top Inteligencia</h2>

            <ol id="topInteligencia"></ol>

        </div>

    </div>

    <hr>
    

    <h2>Curiosidades</h2>

    <div class="card">

        <p id="juegoMasPersonajes"></p>

        <p id="zonaMasPersonajes"></p>

        <p id="habilidadMasComun"></p>

    </div>

    <script src="js/modulos/xmlReader.js"></script>
    <script src="js/estadisticas.js"></script>
    </main>
</body>
</html>
